<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7Store - System Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display:flex; align-items:center; justify-content:center;">
    
    <div class="card" style="width: 100%; max-width: 440px; position:relative;">
        <div style="margin-top: 24px; text-align:center;">
            <div class="logo-tile" style="margin: 0 auto 24px auto; width:48px; height:48px;">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:24px; height:24px;">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </div>
            
            <h1 style="font-size:32px; margin-bottom: 8px;">Welcome <span class="accent-text">back</span></h1>
            <p style="margin:0 auto 32px auto;">Secure access for authorized personnel.</p>
        </div>

        <form id="login-form" style="display:flex; flex-direction:column; gap:16px;">
            <input type="text" id="username" placeholder="Username" required>
            <div style="position:relative;">
                <input type="password" id="password" placeholder="Password" required>
                <button type="button" onclick="togglePassword()" style="position:absolute; right:16px; top:14px; background:none; color:var(--text-muted); font-weight:600; font-size:12px; letter-spacing:0.05em;">SHOW</button>
            </div>
            
            <button type="submit" id="login-btn" class="btn-primary" style="justify-content:center; padding:16px; margin-top:8px; font-size:16px;">
                Sign In 
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>
        
        <div style="text-align:center; margin-top:32px;">
            <a href="index.html" style="color:var(--text-muted); font-size:14px; font-weight:600;">&larr; Back to Storefront</a>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const btn = event.target;
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerText = 'HIDE';
            } else {
                input.type = 'password';
                btn.innerText = 'SHOW';
            }
        }

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = 'Authenticating...';
            btn.disabled = true;

            const res = await apiCall('login', {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            });

            if (res.success) {
                if (res.role === 'admin') window.location.href = 'admin/index.html';
                else if (res.role === 'staff') window.location.href = 'staff/index.html';
            } else {
                showToast(res.error, 'error');
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
